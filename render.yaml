services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: knowledgeguardai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: ENV
        value: production

      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: knowledgeguard-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://knowledgeguardai-1.onrender.com,https://knowledgeguardai.onrender.com"
      - key: CHROMA_PERSIST_DIR
        value: ./data/chromadb

  # ----------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: static
    name: knowledgeguardai-1
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://knowledgeguardai.onrender.com
      - key: VITE_API_BASE_URL
        value: https://knowledgeguardai.onrender.com

# ------------------------------------------------------------------------------
# 3. PostgreSQL Managed Database
# ------------------------------------------------------------------------------
databases:
  - name: knowledgeguard-postgres
    plan: free
    region: oregon
    databaseName: knowledgeguard
    user: knowledgeguard_user
